<!doctype html>
<html lang="en"><head>
<!-- skill:chrome -->
<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

selected=null;$('photo').onchange=e=>{selected=e.target.files[0];if(!selected)return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};r.readAsDataURL(selected)};$('submit').onclick=async()=>{if(!$('name').value||!$('price').value){$('status').textContent='Enter a product name and price.';return}if(API.includes('PASTE_')){$('status').textContent='https://script.google.com/macros/s/AKfycbxBLEq86vGGpG3apdohPJkdqH9vFUuAaPfjb1xbAqwZYLhFPTXIGgOgtu-YZD4_CWqQ/exec';return}$('submit').disabled=true;$('status').textContent='Uploading...';let imageBase64='',imageName='',imageType='';if(selected){const data=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.readAsDataURL(selected)});imageBase64=data;imageName=selected.name;imageType=selected.type}try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:$('name').value,price:$('price').value,category:$('category').value,description:$('description').value,imageBase64,imageName,imageType})});const out=await res.json();if(!out.ok)throw new Error(out.error||'Upload failed');$('status').textContent='Product added. Refresh the shop to see it.';$('name').value='';$('price').value='';$('description').value='';$('photo').value='';$('preview').style.display='none';selected=null}catch(e){$('status').textContent='Could not add product: '+e.message}finally{$('submit').disabled=false}}</script></body></html>
